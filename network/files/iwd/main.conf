# ══════════════════════════════════════════════════════════════════════════
#  iwd · demonio wifi (backend nativo de impala)
#  → /etc/iwd/main.conf
# ══════════════════════════════════════════════════════════════════════════

[General]
# EL AJUSTE CRÍTICO PARA ESTA TARJETA (RTL8821CE / rtw88).
#
# Con el método moderno de puerto de control (por nl80211), los paquetes EAPOL
# del handshake WPA2 de 4 vías no llegan al router en este driver. iwd falla con
# 'connect-failed, status: 1' mientras wpa_supplicant conecta sin problema — que
# es exactamente el síntoma que se vio aquí.
#
# Esto fuerza el método antiguo (por la interfaz de red), que sí funciona.
# Si algún día actualizas de tarjeta, esto sobra y puede quitarse.
ControlPortOverNL80211=false

# Sin aleatorización de MAC: algunos drivers/routers rechazan la asociación
# cuando la MAC cambia en cada intento.
AddressRandomization=disabled

# iwd hace su propio DHCP. Así el wifi no depende de systemd-networkd:
# una pieza móvil menos que pueda fallar.
EnableNetworkConfiguration=true

[Network]
# Delega la resolución de nombres en systemd-resolved, que es quien aplica el
# DNS-over-TLS (ver resolved.conf.d/dns-over-tls.conf).
NameResolvingService=systemd
