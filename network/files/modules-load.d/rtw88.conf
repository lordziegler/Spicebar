# Carga explícita del driver wifi en el arranque.
#
# En teoría es REDUNDANTE: udev ya carga rtw88_8821ce solo, resolviendo el
# modalias PCI de la tarjeta (pci:v000010ECd0000C821...). Si todo está sano,
# este archivo no cambia nada.
#
# Existe como RED DE SEGURIDAD. systemd-modules-load hace modprobe POR NOMBRE, y
# el nombre explícito se salta cualquier 'blacklist' que se cuele en
# /etc/modprobe.d. Es decir: si alguien vuelve a poner el blacklist que dejó
# este portátil sin wifi (ver modprobe.d/rtw88.conf), el wifi SEGUIRÁ
# arrancando.
#
# Es tirantes además de cinturón, y el coste es cero.
rtw88_8821ce
