# DNS-over-TLS → /etc/systemd/resolved.conf.d/dns-over-tls.conf
#
# POR QUÉ: la red de casa DESCARTA el DNS por UDP/53 (comprobado: no responden
# ni el router, ni Cloudflare, ni Quad9, ni Google por UDP; todos responden por
# TCP). systemd-resolved intenta UDP primero, espera ~5 s a que expire y solo
# entonces reintenta por TCP — de ahí las consultas de 6 segundos y los fallos
# intermitentes de resolución que parecían "el wifi va lento".
#
# DoT va por TCP/853 (verificado abierto), así que esquiva el problema de raíz.
# De regalo, el DNS queda cifrado.
#
# Si algún día cambias de red y esto estorba, se quita con:
#     sudo rm /etc/systemd/resolved.conf.d/dns-over-tls.conf
#     sudo systemctl restart systemd-resolved

[Resolve]
# 'Domains=~.' enruta TODAS las consultas a estos servidores, ignorando el DNS
# del router que llega por DHCP (que es precisamente el que no responde).
DNS=1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com 9.9.9.9#dns.quad9.net
Domains=~.
DNSOverTLS=yes
Cache=yes
