# ══════════════════════════════════════════════════════════════════════════
#  RTL8821CE (Realtek) · driver rtw88_8821ce — Landsraad
#
#  ⚠  NUNCA pongas 'blacklist rtw88_8821ce' AQUÍ NI EN NINGÚN OTRO SITIO.
#
#  Ese blacklist es el que dejó el portátil sin wifi tras cada reinicio, y es
#  un fallo que engaña muchísimo, así que merece la explicación entera:
#
#    · Un 'blacklist' impide que udev cargue el módulo POR MODALIAS, que es
#      justo el mecanismo con el que se autocarga en el arranque. Resultado:
#      arrancas y no existe wlan0. Ni iwd ni NetworkManager ven radio alguna.
#
#    · Pero 'modprobe rtw88_8821ce' POR NOMBRE EXPLÍCITO se salta el blacklist.
#      Así que el arreglo manual funciona al instante y parece que el problema
#      era otra cosa. Esa asimetría (no carga solo / sí carga a mano) es la
#      firma inequívoca de un blacklist, y es lo que hay que reconocer.
#
#    · Peor aún: un blacklist NO descarga lo que ya está cargado. Si lo escribes
#      con el módulo ya en memoria, todo sigue funcionando de maravilla hasta el
#      siguiente reinicio. La bomba queda armada con retardo.
#
#  Ese blacklist solo tiene sentido si vas a usar el driver alternativo
#  rtl8821ce-dkms (fuera del kernel), y SOLO si lo instalas de verdad. El driver
#  del kernel (rtw88) funciona bien en esta tarjeta con las opciones de abajo,
#  así que no hay ninguna razón para cambiarlo.
# ══════════════════════════════════════════════════════════════════════════

# Estabilidad. Sin esto la tarjeta genera tormentas de errores de bus:
#   rtw88_8821ce 0000:02:00.0: PCIe Bus Error: severity=Correctable,
#                              type=Physical Layer, (Receiver ID) ... RxErr
# y sufre cortes intermitentes y caídas de rendimiento.
#
#   disable_lps_deep  el ahorro de energía profundo cuelga el chip.
#   disable_aspm      el ASPM del bus PCIe es el causante de los RxErr.
#   disable_msi       las interrupciones MSI dan problemas en este modelo.
options rtw88_core disable_lps_deep=y
options rtw88_pci disable_msi=y disable_aspm=y
